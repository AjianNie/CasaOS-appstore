name: Create Release

permissions:
  contents: write

on:
  push:
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.json'
      - 'Tools/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build AppStore distribution
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: .
          output: dist
          base-url: https://github.com/AjianNie/CasaOS-appstore/releases/download/new

      - name: Package AppStore
        run: |
          cp Tools/index.html dist/
          cd dist
          zip -r ../AppStore.zip .

      - name: Delete previous latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view new >/dev/null 2>&1; then
            gh release delete new --yes --cleanup-tag
          elif git ls-remote --exit-code --tags origin refs/tags/new >/dev/null 2>&1; then
            git push origin :refs/tags/new
          fi

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          files: AppStore.zip
          tag_name: new
          name: Latest
          draft: false
          prerelease: false
          body: Generated from the latest commit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
