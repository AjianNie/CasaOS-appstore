name: Create Release

permissions:
  contents: write

on:
  push:
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.json'
      - 'Tools/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Build AppStore distribution
        uses: IceWhaleTech/build-appstore-action@8e65e790b4e6da62dc0605e259b9219dd548a2ac # v1
        with:
          source: .
          output: dist
          base-url: https://github.com/AjianNie/CasaOS-appstore/releases/download/new

      - name: Package AppStore
        run: |
          cp Tools/index.html dist/
          cd dist
          zip -r ../AppStore.zip .

      - name: Delete previous latest release
        uses: dev-drprasad/delete-tag-and-release@82600feb9527126eca69833f07bafe53279bd9b4 # v1.1
        with:
          tag_name: new
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish latest release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: AppStore.zip
          tag_name: new
          name: Latest
          draft: false
          prerelease: false
          body: Generated from the latest commit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
